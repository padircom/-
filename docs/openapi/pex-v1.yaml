components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Lang:
      name: Accept-Language
      in: header
      schema: { type: string, enum: [fa, en], default: fa }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor; alternative to offset
  responses:
    E400:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Err' }
          example: { ok: false, error: { code: VALIDATION, messageFa: نامعتبر, messageEn: Invalid } }
    E401:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Err' }
          example: { ok: false, error: { code: TOKEN_EXPIRED, messageFa: منقضی, messageEn: Expired } }
    E403:
      description: Forbidden ABAC
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Err' }
          example: { ok: false, error: { code: FORBIDDEN, messageFa: غیرمجاز, messageEn: Forbidden } }
    E404:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Err' }
          example: { ok: false, error: { code: NOT_FOUND, messageFa: یافت نشد, messageEn: Not found } }
    E409:
      description: Conflict SCOPE_LOCKED / STALE / CYCLE / PERIOD_CLOSED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Err' }
          example: { ok: false, error: { code: SCOPE_LOCKED, messageFa: نیاز به CR, messageEn: CR required } }
    E429:
      description: Rate limited
      headers:
        Retry-After: { schema: { type: integer }, example: 60 }
        X-RateLimit-Remaining: { schema: { type: integer }, example: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Err' }
          example: { ok: false, error: { code: RATE, messageFa: زیاد, messageEn: Too many requests } }
    E500:
      description: Server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Err' }
          example: { ok: false, error: { code: INTERNAL, messageFa: داخلی, messageEn: Internal } }
  schemas:
    Err:
      type: object
      properties:
        ok: { type: boolean, enum: [false] }
        error:
          type: object
          properties:
            code: { type: string }
            messageFa: { type: string }
            messageEn: { type: string }
    Page:
      type: object
      properties:
        offset: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        nextCursor: { type: string, nullable: true }
    Ok:
      type: object
      properties:
        ok: { type: boolean }
        data: { type: object, additionalProperties: true }
        page: { $ref: '#/components/schemas/Page' }
    WbsNode:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        nameFa: { type: string }
        nameEn: { type: string }
        nodeType: { type: string, enum: [WP, CA, Summary] }
        weight: { type: number }
        isLocked: { type: boolean }
    WbsCreate:
      type: object
      required: [code, nameFa, nameEn]
      properties:
        parentId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        nameFa: { type: string }
        nameEn: { type: string }
        nodeType: { type: string }
        weight: { type: number }
    WbsPatch:
      type: object
      properties:
        nameFa: { type: string }
        nameEn: { type: string }
        weight: { type: number }
        crId: { type: string, format: uuid }
    WbsEnvelope:
      type: object
      properties:
        ok: { type: boolean }
        data: { $ref: '#/components/schemas/WbsNode' }
    WbsListEnvelope:
      type: object
      properties:
        ok: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/WbsNode' } }
        page: { $ref: '#/components/schemas/Page' }
    Activity:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        nameFa: { type: string }
        durationHours: { type: number }
        totalFloatH: { type: number }
        isCritical: { type: boolean }
        externalIdP6: { type: string }
    ActivityCreate:
      type: object
      properties:
        wbsId: { type: string, format: uuid }
        code: { type: string }
        nameFa: { type: string }
        nameEn: { type: string }
        durationHours: { type: number }
        actType: { type: string }
    ActivityEnvelope:
      type: object
      properties:
        ok: { type: boolean }
        data: { $ref: '#/components/schemas/Activity' }
    ActivityListEnvelope:
      type: object
      properties:
        ok: { type: boolean }
        data: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        page: { $ref: '#/components/schemas/Page' }
    MilestoneCreate:
      type: object
      required: [activityId, msType]
      properties:
        activityId: { type: string, format: uuid }
        msType: { type: string, enum: [Contractual, Key, Payment, Gate, Internal, Interface] }
        contractualDate: { type: string, format: date }
        penaltyPerDay: { type: number }
    DprCreate:
      type: object
      required: [reportDate]
      properties:
        reportDate: { type: string, format: date }
        shift: { type: string }
        progressLines: { type: array, items: { type: object } }
    AlertRule:
      type: object
      properties:
        category: { type: string }
        rule: { type: object, additionalProperties: true }
        isActive: { type: boolean }
    WebhookEvent:
      type: object
      required: [event, at, projectId]
      properties:
        event:
          type: string
          enum: [milestone.achieved, alert.triggered, period.closed, baseline.locked, cpm.completed]
        at: { type: string, format: date-time }
        projectId: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
      example:
        event: cpm.completed
        at: '2026-09-04T12:00:00Z'
        projectId: 66666666-6666-6666-6666-666666666666
        payload: { jobId: '44444444-4444-4444-4444-444444444444', healthScore: 78 }
