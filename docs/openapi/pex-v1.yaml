  /projects/{projectId}/cp/snapshots:
    get:
      tags: [CriticalPath]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: Snapshots, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }

  /cp/snapshots/{id}/activities:
    get:
      tags: [CriticalPath]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: CP activities, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/cp/float-trend:
    get:
      tags: [CriticalPath]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: Float trend, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/cp/health:
    get:
      tags: [CriticalPath]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
