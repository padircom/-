      tags: [Milestone]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200':
          description: Register
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true, data: [{ code: 'MS-MECH-RFSU', status: Delayed, penaltyEst: 125000 }] }
        '401': { $ref: '#/components/responses/E401' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }
    post:
      tags: [Milestone]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneCreate' }
            example: { activityId: '55555555-5555-5555-5555-555555555555', msType: Contractual, contractualDate: '2025-02-03', penaltyPerDay: 25000 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /milestones/{id}:
    patch:
      tags: [Milestone]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { forecastDate: { type: string, format: date }, crId: { type: string, format: uuid }, reason: { type: string } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/milestones/alerts:
    get:
      tags: [Milestone]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: MS alerts, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/milestones/reports/{n}:
    get:
      tags: [Milestone]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: n, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 10 } }]
      responses:
        '200': { description: Report 1-10, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/milestones/widget:
    get:
      tags: [Milestone]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: Dashboard widget, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/milestones/penalty:
    get:
      tags: [Milestone]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: Penalty/bonus, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
