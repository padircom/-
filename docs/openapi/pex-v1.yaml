      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Closed immutable, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/lookahead:
    get:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: weeks, in: query, schema: { type: integer, enum: [1, 2, 3, 4, 6] } }]
      responses:
        '200': { description: Lookahead, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }
    post:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/milestones:
