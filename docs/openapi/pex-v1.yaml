openapi: 3.0.3
info:
  title: PMIS PEX Planning & Execution API
  version: 1.0.0
  description: |
    API ماژول برنامه‌ریزی و اجرا (Deliverable 12).

    WBS ستون فقرات است. Baseline قفل. Excel/XER ظرف. Progress فقط Approved.

    ## Auth
    `Authorization: Bearer <JWT>` با claims پروژه. ABAC روی projectId.

    ## Pagination
    - Offset: `offset` (default 0), `limit` (default 50, max 200)
    - Cursor: `cursor` opaque؛ پاسخ `page.nextCursor`

    ## Rate limiting
    120 req/min/IP؛ upload/import 20/min؛ CPM compute 10/min.
    429 + header `Retry-After`. `X-RateLimit-Remaining` اختیاری.

    ## Webhooks
    HMAC header `X-PMIS-Signature`. رویدادها در `components.schemas.WebhookEvent`.
  contact: { name: Arena PEX }
servers:
  - url: http://localhost:5000/api/v1/pex
    description: Local
security:
  - bearerAuth: []

tags:
  - name: WBS
  - name: Schedule
  - name: Milestone
  - name: CriticalPath
  - name: EVM
  - name: Resource
  - name: Site
  - name: PMS
  - name: Reports
  - name: Alerts

paths:
  /projects/{projectId}/wbs:
    get:
      tags: [WBS]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Lang' }]
      responses:
        '200':
          description: WBS tree/list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WbsListEnvelope' }
              example: { ok: true, data: [{ id: '11111111-1111-1111-1111-111111111111', code: '1.2', nameFa: 'فونداسیون', weight: 0.12 }], page: { offset: 0, limit: 50, total: 1 } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }
    post:
      tags: [WBS]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WbsCreate' }
            example: { parentId: null, code: '1', nameFa: 'مهندسی', nameEn: 'Engineering', nodeType: Summary, weight: 1 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/WbsEnvelope' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /wbs/{id}:
    get:
      tags: [WBS]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Node, content: { application/json: { schema: { $ref: '#/components/schemas/WbsEnvelope' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }
    patch:
      tags: [WBS]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WbsPatch' }
            example: { nameEn: 'Foundations', crId: '22222222-2222-2222-2222-222222222222' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/WbsEnvelope' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /wbs/{id}/move:
    post:
      tags: [WBS]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { parentId: { type: string, format: uuid } } }
      responses:
        '200': { description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /wbs/{id}/dictionary:
    get:
      tags: [WBS]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Dictionary, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }
    put:
      tags: [WBS]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { acceptanceFa: { type: string } } }
            example: { acceptanceFa: 'بتن به مقاومت مشخصه' }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/wbs/import:
    post:
      tags: [WBS]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                source: { type: string, enum: [xlsx, xer, msp] }
      responses:
        '200': { description: Import result, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '429': { $ref: '#/components/responses/E429' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/ca:
    get:
      tags: [WBS]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: Control accounts, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }

  /ai/wbs/analyze:
    post:
      tags: [WBS]
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { projectId: { type: string, format: uuid }, file: { type: string, format: binary } } }
      responses:
        '202': { description: Analysis job, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '500': { $ref: '#/components/responses/E500' }

  /ai/wbs/{reqId}/approve:
    post:
      tags: [WBS]
      parameters: [{ name: reqId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Applied to WBS, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/activities:
    get:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/Offset' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: Activities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityListEnvelope' }
              example: { ok: true, data: [{ code: 'PIP-ISO-012', totalFloatH: 0, isCritical: true }], page: { offset: 0, limit: 50, total: 1, nextCursor: 'eyJvIjoxfQ' } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }
    post:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityCreate' }
            example: { wbsId: '11111111-1111-1111-1111-111111111111', code: 'CIV-001', nameFa: 'بتن فونداسیون', durationHours: 80 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityEnvelope' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /activities/{id}:
    patch:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityCreate' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityEnvelope' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /activities/{id}/rels:
    get:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Relationships, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }
    post:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [succId, relType], properties: { succId: { type: string, format: uuid }, relType: { type: string, enum: [FS, SS, FF, SF] }, lagHours: { type: number } } }
            example: { succId: '33333333-3333-3333-3333-333333333333', relType: FS, lagHours: 8 }
      responses:
        '201': { description: Linked, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/cpm/compute:
    post:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { dataDate: { type: string, format: date } } }
            example: { dataDate: '2026-09-04' }
      responses:
        '202': { description: Job accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' }, example: { ok: true, data: { jobId: '44444444-4444-4444-4444-444444444444' } } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '429': { $ref: '#/components/responses/E429' }
        '500': { $ref: '#/components/responses/E500' }

  /cpm/jobs/{id}:
    get:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Job status, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/baselines:
    get:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: Baselines, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '404': { $ref: '#/components/responses/E404' }
        '500': { $ref: '#/components/responses/E500' }
    post:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /baselines/{id}/lock:
    post:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Locked, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '404': { $ref: '#/components/responses/E404' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /projects/{projectId}/schedule/update:
    post:
      tags: [Schedule]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { dataDate: { type: string, format: date } } }
      responses:
        '200': { description: Update opened, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '409': { $ref: '#/components/responses/E409' }
        '500': { $ref: '#/components/responses/E500' }

  /periods/{id}/close:
